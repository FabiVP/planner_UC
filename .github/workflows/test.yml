name: CI - Tests y Calidad

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: backend

      - name: Run lint
        run: npx eslint .
        working-directory: backend
        continue-on-error: true

      - name: Run tests with coverage
        run: npm test -- --coverage
        working-directory: backend
        env:
          NODE_ENV: test
          JWT_SECRET: test_secret
          MONGODB_URI: mongodb://localhost:27017/unischeduler_test

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage/

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Run lint
        run: npx eslint .
        working-directory: frontend
        continue-on-error: true

      - name: Run tests with coverage
        run: npm test -- --coverage
        working-directory: frontend

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/

  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Playwright
        run: npx playwright install --with-deps
        working-directory: frontend

      - name: Start servers
        run: |
          cd backend && npm run dev &
          cd frontend && npm run dev &
          sleep 10

      - name: Run E2E tests
        run: npx playwright test
        working-directory: frontend
        env:
          NODE_ENV: test
          JWT_SECRET: test_secret
          MONGODB_URI: mongodb://localhost:27017/unischeduler_test

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/

  quality-report:
    name: Generar reporte de calidad
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]

    steps:
      - name: Download coverage artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: *-coverage

      - name: Resumen
        run: |
          echo "✅ Backend tests completados"
          echo "✅ Frontend tests completados"
          echo "📊 Revisar artefactos de cobertura para métricas detalladas"
