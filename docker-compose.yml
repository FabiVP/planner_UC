version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: unischeduler-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: unischeduler

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: unischeduler-backend
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/unischeduler
      JWT_SECRET: unischeduler_docker_secret_2026
      JWT_EXPIRES_IN: 8h
    depends_on:
      - mongodb

  frontend:
    image: node:20-alpine
    container_name: unischeduler-frontend
    working_dir: /app/frontend
    volumes:
      - ./frontend:/app/frontend
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend

volumes:
  mongo-data:
