# ===================================================
# SonarQube Project Configuration — UniScheduler
# Taller de Proyectos 2 – Universidad Continental
# ===================================================

sonar.projectKey=unischeduler
sonar.projectName=UniScheduler - Sistema de Horarios Academicos
sonar.projectVersion=1.0.0

# Source encoding
sonar.sourceEncoding=UTF-8

# ---- Source Directories ----
sonar.sources=frontend/src,backend
sonar.tests=frontend/src/tests,backend/tests,e2e

# ---- Exclusions ----
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/coverage/**,\
  **/build/**,\
  **/*.min.js,\
  **/seed/**,\
  **/test-results/**,\
  **/public/**,\
  frontend/src/main.jsx

sonar.test.exclusions=**/node_modules/**,**/dist/**

# ---- Coverage Reports (LCOV) ----
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/lcov.info

# ---- JavaScript settings ----
sonar.javascript.environments=browser,node
sonar.javascript.file.suffixes=.js,.jsx,.mjs,.cjs

# ---- Quality Gate ----
sonar.qualitygate.wait=true

# ---- SonarQube local host (descomentar para analisis local) ----
# sonar.host.url=http://localhost:9000
# sonar.token=<your-token-here>
